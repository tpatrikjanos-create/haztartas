<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Háztartás</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0a0e1a;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.11);--line:rgba(255,255,255,.1);--tx:#eef1ff;--mu:#9aa3c7;
  --a1:#2dd4bf;--a2:#3b82f6;--ok:#34d399;--low:#fbbf24;--out:#fb7185;--ease:cubic-bezier(.23,1,.32,1);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
body[data-user=dorina]{--a1:#fb7185;--a2:#f59e0b}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:var(--bg)}
body{margin:0;background:transparent;color:var(--tx);font:16px/1.4 ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;padding:0;transition:transform .16s var(--ease),background .2s,opacity .2s}
button:active{transform:scale(.96)}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0;outline:none;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--a1);background:rgba(255,255,255,.1)}
select option{color:#111}
::placeholder{color:#6d7699}
h1,h2,h3,p{margin:0}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.34;animation:drift 24s ease-in-out infinite alternate;transition:background 1s}
.aurora i:nth-child(1){background:var(--a1);top:-28vmax;left:-24vmax}
.aurora i:nth-child(2){background:var(--a2);bottom:-28vmax;right:-24vmax;animation-delay:-9s}
.aurora i:nth-child(3){background:#8b5cf6;width:40vmax;height:40vmax;top:35%;left:40%;opacity:.16;animation-delay:-4s}
@keyframes drift{to{transform:translate3d(9vmax,6vmax,0) scale(1.15)}}
#view{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) 14px calc(130px + var(--sb))}
.anim>.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:12px;font-weight:600}
.mu{color:var(--mu)} .sm{font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wrap{overflow-wrap:anywhere}
/* topbar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.avatar{width:50px;height:50px;border-radius:18px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-size:28px;flex:none;box-shadow:0 8px 24px -8px var(--a1)}
.avatar span{display:block;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-6deg)}}
.ttl{flex:1;min-width:0}.ttl h1{font-size:22px;font-weight:750;letter-spacing:-.02em}.ttl p{color:var(--mu);font-size:13px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 10px;flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:#64748b}
.sync.live i{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
.sync.offline i{background:var(--low)}.sync.connecting i{background:var(--a2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* buttons */
.btn{background:linear-gradient(135deg,var(--a1),var(--a2));color:#04101a;font-weight:700;border-radius:16px;padding:14px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 30px -12px var(--a1)}
.btn.ghost{background:var(--card2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:rgba(251,113,133,.14);color:var(--out);box-shadow:none}
.btn.block{width:100%}.btn.s{padding:9px 13px;border-radius:12px;font-size:14px}
.btn:disabled{opacity:.5}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.08)}.iconbtn:hover,.row.tap:hover{background:var(--card2)}.nav button:hover{color:var(--tx)}}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row>.grow{flex:1;min-width:0}
.row.tap{cursor:pointer;border-radius:12px;transition:background .2s}
.tile{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none;background:var(--card2)}
.empty{text-align:center;padding:26px 10px;color:var(--mu)}
.empty .e{font-size:44px;display:block;margin-bottom:8px;animation:bob 3s ease-in-out infinite}
.pair{display:flex;gap:8px}.pair>*{flex:1}
.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--mu);margin:0 0 5px 4px;letter-spacing:.04em}
/* hero */
.hero .lab{color:var(--mu);font-size:13px}.hero .num{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.delta{display:inline-block;font-size:13px;padding:3px 9px;border-radius:20px;background:var(--card2)}
.delta.up{color:var(--out)}.delta.down{color:var(--ok)}
.spark{height:60px;margin-top:10px}.spark svg{width:100%;height:100%;overflow:visible}
.anim .spark .line{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.1s .2s var(--ease) forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.q .qi{font-size:26px}.q b{font-size:15px}.q span.s{font-size:13px;color:var(--mu)}
.q.main{background:linear-gradient(135deg,var(--a1),var(--a2));border:0;color:#04101a}.q.main span.s{color:rgba(4,16,26,.7)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));width:min(560px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,24,48,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:26px;padding:6px;z-index:20}
.nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 30%,transparent),color-mix(in srgb,var(--a2) 30%,transparent));transition:transform .45s var(--ease);transform:translateX(calc(var(--i)*100%))}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--mu);font-size:11px;border-radius:20px}
.nav button.on{color:var(--tx)}
.nav button svg{transition:transform .35s var(--ease)}.nav button.on svg{transform:translateY(-1px) scale(1.12)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(88px + var(--sb));width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#04101a;display:grid;place-items:center;box-shadow:0 14px 34px -10px var(--a1);z-index:19;animation:pop .5s var(--ease) both .3s}
@keyframes pop{from{transform:scale(0)}}
body.picking .nav,body.picking .fab{display:none}
/* segmented */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:rgba(255,255,255,.07);border-radius:14px;padding:3px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:11px;background:linear-gradient(135deg,var(--a1),var(--a2));transform:translateX(calc(var(--i)*100%));transition:transform .4s var(--ease),background .3s}
.seg[data-v=ok] .thumb{background:var(--ok)}.seg[data-v=low] .thumb{background:var(--low)}.seg[data-v=out] .thumb{background:var(--out)}
.seg button{position:relative;padding:8px 4px;font-size:14px;color:var(--mu);border-radius:11px;transition:color .25s}
.seg button.on{color:#04101a;font-weight:700}
/* inventory + list */
.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:16px 4px 8px;display:flex;align-items:center;gap:8px;color:var(--mu)}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:8px}
.item .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}.item .hd b{flex:1;min-width:0;font-weight:600}
.x{width:30px;height:30px;border-radius:10px;color:var(--mu);display:grid;place-items:center;flex:none}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--mu);flex:none;display:grid;place-items:center;color:transparent;transition:all .3s var(--ease)}
.sitem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;transition:transform .4s var(--ease),opacity .35s,max-height .4s .1s,margin .4s .1s,padding .4s .1s;max-height:80px;overflow:hidden}
.sitem.done{transform:translateX(60px);opacity:0;max-height:0;margin:0;padding-top:0;padding-bottom:0}
.sitem.done .check{background:var(--ok);border-color:var(--ok);color:#04101a}
.who{font-size:18px;flex:none}
/* menu */
.week{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px}.week b{font-size:15px}
.day{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:8px;min-height:68px}
.day.today{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1) inset,0 10px 30px -16px var(--a1)}
.dd{width:44px;text-align:center;flex:none}.dd b{display:block;font-size:12px;color:var(--mu);font-weight:600;letter-spacing:.05em;text-transform:uppercase}.dd span{font-size:22px;font-weight:750}
.day .tile{color:#fff}
.addday{flex:1;border:1.5px dashed var(--line);border-radius:14px;padding:13px;color:var(--mu);text-align:center;font-size:14px}
.deck{position:relative;height:min(430px,60dvh);margin:6px 0 14px;touch-action:pan-y}
.scard{position:absolute;inset:0;border-radius:30px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;box-shadow:0 24px 50px -20px rgba(0,0,0,.6);transition:transform .45s var(--ease);will-change:transform;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.scard.top{cursor:grab;z-index:3}.scard.top:active{cursor:grabbing}
.scard .semoji{position:absolute;top:8%;left:0;right:0;text-align:center;font-size:clamp(90px,28vw,130px);filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));animation:bob 4s ease-in-out infinite}
.scard h3{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;overflow-wrap:anywhere}
.ings{display:flex;flex-wrap:wrap;gap:6px}.ings span{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);padding:5px 10px;border-radius:14px;font-size:13px}
.stamp{position:absolute;top:24px;border:3px solid;border-radius:12px;padding:4px 12px;font-weight:900;font-size:22px;letter-spacing:.06em;opacity:0;transform:rotate(-12deg)}
.stamp.yes{left:20px;color:#bbf7d0;border-color:#bbf7d0;opacity:var(--sy,0)}
.stamp.no{right:20px;color:#fecdd3;border-color:#fecdd3;opacity:var(--sn,0);transform:rotate(12deg)}
.deck-empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;border:1.5px dashed var(--line);border-radius:30px;padding:20px}
.big-emoji{font-size:56px}
.actions{display:flex;justify-content:center;gap:18px;margin-bottom:6px}
.sync.dot{padding:9px;gap:0}.sync.dot span{display:none}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--card2);border:1px solid var(--line)}
.round.s{width:48px;height:48px;font-size:20px;align-self:center}
.round.yes{background:rgba(52,211,153,.18)}.round.no{background:rgba(251,113,133,.18)}
/* stats */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mnav b{font-size:17px}
.donutw{display:flex;gap:16px;align-items:center}.donut{width:132px;height:132px;position:relative;flex:none}.donut svg{width:100%;height:100%}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--mu)}.donut .c b{font-size:15px;color:var(--tx)}
.legend{flex:1;min-width:0}.lg{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}.lg .n{flex:1;min-width:0}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--a1),var(--a2));transform-origin:left}
.anim .bar i{animation:grow .9s var(--ease) both .15s}@keyframes grow{from{transform:scaleX(0)}}
.brow{margin-bottom:12px}.brow:last-child{margin-bottom:0}.brow .t{display:flex;justify-content:space-between;gap:10px;font-size:14px}
/* sheet */
.sback{position:fixed;inset:0;background:rgba(3,6,15,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .3s;z-index:40}.sback.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90dvh;overflow:auto;overscroll-behavior:contain;background:#121830;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .42s var(--ease);z-index:41;padding:0 16px calc(20px + var(--sb))}
.sheet.open{transform:translateY(0)}
.grab{position:sticky;top:0;padding:10px 0 12px;display:grid;place-items:center;touch-action:none;background:#121830;z-index:2}.grab::before{content:"";width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
.sbody h2.t{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px;text-transform:none;color:var(--tx);letter-spacing:-.02em}
.err{color:var(--out);font-size:14px;margin:6px 2px}
.scan{position:relative;border-radius:20px;overflow:hidden;margin-bottom:12px;background:#000}.scan img{display:block;width:100%;max-height:300px;object-fit:cover;opacity:.7}
.scan::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--a1),transparent);box-shadow:0 0 22px var(--a1);animation:scanl 1.6s ease-in-out infinite alternate}
@keyframes scanl{from{top:0}to{top:calc(100% - 3px)}}
.rrow{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.rrow .l2{display:grid;grid-template-columns:62px 1fr 1.3fr 36px;gap:8px;align-items:center}
.rrow input,.rrow select{padding:10px}
.raw{font-size:12px;color:var(--mu);padding:0 4px;overflow-wrap:anywhere}.raw.guess{color:var(--low)}
.rrow.guess{border-color:rgba(251,191,36,.55)}
.total{font-size:26px;font-weight:800;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translate(-50%,0);background:#1c2447;border:1px solid var(--line);color:var(--tx);padding:11px 16px;border-radius:16px;z-index:60;box-shadow:0 14px 40px -12px #000;max-width:calc(100% - 32px);text-align:center;font-size:15px;animation:toast .45s var(--ease) both}
.toast.out{opacity:0;transform:translate(-50%,10px);transition:all .3s}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px) scale(.94)}}
.conf{position:fixed;z-index:70;pointer-events:none;font-size:22px}
/* profile pick */
.pick{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 20px) 18px calc(30px + var(--sb));max-width:560px;margin:0 auto}
.pick h1{font-size:34px;font-weight:850;letter-spacing:-.03em;text-align:center}.pick .sub{text-align:center;color:var(--mu);margin:6px 0 26px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{position:relative;overflow:hidden;border-radius:30px;padding:26px 14px 22px;min-height:min(300px,46dvh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;box-shadow:0 26px 50px -24px var(--c);transition:transform .5s var(--ease),opacity .4s,filter .4s;animation:rise .7s var(--ease) both}
.pcard[data-p=patrik]{--c:#0ea5e9;background:linear-gradient(160deg,#14b8a6,#2563eb)}
.pcard[data-p=dorina]{--c:#f43f5e;background:linear-gradient(160deg,#fb7185,#f59e0b);animation-delay:.1s}
.pcard .pet{font-size:clamp(70px,22vw,98px);line-height:1;filter:drop-shadow(0 12px 14px rgba(0,0,0,.3));animation:wag 2.6s ease-in-out infinite;transform-origin:50% 90%}
.pcard[data-p=dorina] .pet{animation-name:sway;animation-duration:4s}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-4px)}}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.pcard b{font-size:24px;font-weight:800;letter-spacing:-.02em}.pcard span.l{font-size:14px;opacity:.85}
.pcard .fl{position:absolute;bottom:-20px;font-size:22px;opacity:0;animation:flt 6s linear infinite;pointer-events:none}
@keyframes flt{10%{opacity:.8}to{transform:translateY(-330px) rotate(40deg);opacity:0}}
.pcards.chosen .pcard:not(.sel){opacity:0;transform:scale(.88);filter:blur(4px)}.pcards.chosen .pcard.sel{transform:scale(1.06)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div id="view"></div>
<nav class="nav" id="nav"></nav>

<script>
"use strict";
/* ============================================================
   Háztartás – egyetlen fájl, build nélkül.
   Háttér: Firebase Realtime Database REST + EventSource (opcionális),
   nélküle helyben (localStorage) működik. Blokkolvasás: Claude vision,
   közvetlenül a böngészőből (saját API-kulccsal).
   ============================================================ */
const PROFILES = {
  patrik:{name:"Patrik",pet:"🐕‍🦺",petName:"",other:"dorina",quick:["Kutyatáp","Jutalomfalat","Kutyasampon"],sounds:["Vau! 🐾","Sétálunk egyet?","Jutalomfalat? 🦴","Farokcsóválás: 100%"],fl:["🦴","🐾","🎾"]},

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const keyOf=s=>norm(s).replace(/[.$#\[\]\/]/g,"_");

const RINFO={"s1":{"t":90,"s":4,"st":["Forró zsíron puhítsd meg a hagymát, add hozzá a kockázott húst, fűszerezd pirospaprikával.","Pároljuk a húst puhára.","A krumpli nélkül darabolt zöldségeket sós vízben főzzük.","Ha a hús puha, hozzáadjuk a zöldségeket a levükkel, a krumplit, köménymagot, borsot.","Főzzük tovább, amíg a krumpli is megpuhul.","Friss kenyérrel tálaljuk."],"u":"klasszikus-gulyasleves"},"s2":{"t":60,"s":6,"st":["Vágd fel és lapítsd ki a csirkemellet, sózd, borsozd, pihentesd tíz percig.","Forgasd lisztbe, felvert tojásba, majd zsemlemorzsába.","Süsd forró olajban aranybarnára.","A burgonyát főzd puhára, törd össze, keverd habosra vajjal és meleg tejjel.","Tálald a pürével (vagy rizzsel)."],"u":"rantott-csirkemell-vajas-burgonyapurevel"},"s3":{"t":40,"s":4,"st":["Hagymát olajon üvegesre pirítunk, kolbászkarikát adunk hozzá.","Tűzről levéve pirospaprikával keverjük, hozzáadjuk a kockázott burgonyát.","Vízzel éppen ellepjük, sózzuk, paradicsompürét keverünk bele.","Közepes lángon főzzük, amíg a burgonya puha és a szaft sűrű.","Kenyérrel, savanyúsággal tálaljuk."],"u":"paprikas-krumpli"},"s4":{"t":45,"s":4,"st":["Hagymát, sárgarépát apróra kockázunk, zellerzöldet finomra vágunk.","Olajon megpirítjuk a zöldséget és a szalonnát, majd babérlevelet és darált húst adunk hozzá.","Sózzuk, borsozzuk, paradicsompürét teszünk bele, 5 percig pároljuk.","1 dl vízzel felöntve kb. 1 óráig főzzük a raguját.","A spagettit kifőzzük, a raguval és reszelt sajttal tálaljuk."],"u":"bolognai-spagetti"},"s5":{"t":120,"s":4,"st":["Rizst, darált húst, hagymát, fokhagymát, fűszereket összegyúrunk.","A káposztaleveleket megtöltjük, feltekerjük.","A lábas aljára káposztát és füstölt húst teszünk, rá a tekercseket, vízzel ellepjük, 70-80 percig főzzük.","Olajon lisztet pirítunk, pirospaprikát és tejfölt keverünk bele, káposztalével felengedjük.","A rántást rászűrjük, összeforraljuk, tejföllel tálaljuk."],"u":"klasszikus-toltott-kaposzta"},"s6":{"t":30,"s":4,"st":["A hagymát, paprikát felaprítjuk, a paradicsomot kockázzuk, a kolbászt karikázzuk.","A kolbászt olajon megsütjük, félretesszük; a zsiradékon hagymát üvegesítünk, pirospaprikával keverjük.","Hozzáadjuk a paprikát, sózzuk, 10-15 percig fedő alatt pároljuk.","Beletesszük a fokhagymát és a paradicsomot, kb. 10 percig főzzük.","A kolbászt visszakeverjük, kenyérrel tálaljuk (tojást a végén beleverhetsz)."],"u":"egyszeru-kolbaszos-lecso"},"s7":{"t":60,"s":4,"st":["Sós vízben megfőzzük a krumplit és a tojásokat, lehűtjük, meghámozzuk.","A tojást szeleteljük, a kolbászt karikázzuk.","A tojássárgáját tejföllel kikeverjük, a sütőt 180 fokra melegítjük.","Kivajazott tálban rétegezzük: krumpli, tojás, kolbász, tejföl, krumpli.","Tetejére tejföl és szalonna, 35-40 percig sütjük."],"u":"rakott-krumpli"},"s8":{"t":45,"s":4,"st":["Vajon-olajon fagyasztott borsót szódabikarbónával, petrezselyemmel félpuhára pároljuk.","Meghintjük liszttel, fél percig pirítjuk, felöntjük forró vízzel, simára keverjük.","Tejet vagy tejszínt adunk hozzá, összeforraljuk.","Sóval, cukorral ízesítjük.","Tükörtojással vagy fasírttal tálaljuk."],"u":"klasszikus-zoldborsofozelek"},"s9":{"t":45,"s":4,"st":["Hagymát olajon megpirítunk, hozzáadjuk a gyalult tököt, sózzuk, kevés vízzel puhára pároljuk.","Lisztet olajon megpirítunk, pirospaprikával simára keverjük.","A tökhöz keverjük a rántást, kaprot, tejfölt, felforraljuk.","A darált húst tojással, hagymával, fokhagymával, fűszerekkel átgyúrjuk.","Golyókat formázunk, lisztbe forgatjuk, olajban kisütjük, a főzelékkel tálaljuk."],"u":"magyaros-tokfozelek-fasirttal"},"s10":{"t":85,"s":4,"st":["Hagymát, fokhagymát, paprikát, paradicsomot felaprítunk.","Zsíron pirítjuk a hagymát, hozzáadjuk a paprikát, fűszerezzük pirospaprikával, sóval, borssal.","Paradicsomot és fokhagymát adunk hozzá, kicsit besűrítjük.","Beletesszük a csirkecombokat, alaplével puhára főzzük.","Tejfölt lisztel elkeverve a szaftba öntjük, besűrítjük.","Nokedlivel tálaljuk."],"u":"csirkepaprikas"},"s11":{"t":120,"s":6,"st":["A húst és zöldségeket a csontokkal hideg vízbe tesszük.","Forrásig melegítjük, a habot nem szedjük le, fűszereket teafilterben adunk hozzá.","Lassan gyöngyöztetve fél óráig főzzük, majd beletesszük a zöldségeket.","A levestésztát külön főzzük meg.","A zsírt leszedjük, a levest leszűrjük.","A tésztát a forró levesbe tesszük, a húst és a zöldséget külön kínáljuk."],"u":"husleves"},"s12":{"t":55,"s":4,"st":["Olívaolajat zúzott fokhagymával, mustárral, citromlével, fűszerekkel keverünk.","A szárazra törölt csirkecombokat bedörzsöljük a pácal.","Rozmaringgal, citromkarikákkal hűtőbe tesszük (ha van idő, 2-4 órára).","200 fokon bőrös felükkel felfelé tepsiben sütjük 40-50 percig.","Az utolsó 5-10 percben 220 fokra emeljük a ropogós bőrért.","Burgonyával vagy rizzsel tálaljuk."],"u":"rozmaringos-sult-csirkecomb"},"s13":{"t":45,"s":4,"st":["Kifőzzük a fodros kocka tésztát, leszűrjük.","Összekeverjük a túróval és tejföllel.","Kikent tepsiben elegyengetjük, kb. 20 percig sütjük.","Tetejére bőségesen kisütött szalonnát teszünk.","Még 10 percre visszatesszük a sütőbe."],"u":"turos-csusza"},"s14":{"t":30,"s":4,"st":["Tojássárgáját, olajat, sót összekeverünk, lisztet és tejet adunk hozzá.","Szódavizet öntünk bele, fél órát pihentetjük.","Kiolajozott serpenyőbe merőkanálnyi tésztát öntünk, szétterítjük.","Kb. egy percig sütjük, megfordítjuk, a másik oldalát is átsütjük.","Kedvenc töltelékkel megkenjük, feltekerjük, porcukorral szórjuk."],"u":"palacsinta"},"s15":{"t":60,"s":4,"st":["A burgonyát megfőzzük, pürésítjük, kihűtjük; a szilvát megmossuk, kimagozzuk.","A pürét liszttel, vajjal, sóval összegyúrjuk, 5 mm-re kinyújtjuk, négyzetekre vágjuk.","Minden négyzetre szilvát teszünk, fahéjas cukorral megszórjuk, gombóccá formáljuk.","Forró vízben főzzük, amíg felúsznak, majd még 3-5 percig.","Vajon pirított zsemlemorzsában megforgatjuk, fahéjas porcukorral tálaljuk."],"u":"szilvasgomboc"},"s16":{"t":135,"s":4,"st":["Hagymát zsíron világosbarnára pirítunk, tűzről levéve paprikával és húskockákkal pörköljük össze.","Kevés vízzel felengedjük, paprikát, paradicsomot adunk hozzá, sózzuk, fedő alatt pároljuk.","1,5-2 órán át főzzük, amíg a hús puha és a szaft sűrű.","Nokedlihez lisztet, sót, tojást, vizet keverünk szaggatható tésztává.","Forró vízbe szaggatjuk, kifőzzük, leszűrjük, hideg vízzel leöblítjük.","Pörköltszósszal összeforgatjuk, hússal, savanyúsággal tálaljuk."],"u":"sertesporkolt-nokedlivel"},"s17":{"t":80,"s":4,"st":["Zsírban a hagymát üvegesre pároljuk.","Hozzáadjuk a kockázott sertéslapockát, megpirítjuk, sóval, borssal, majoránnával, fokhagymával fűszerezzük.","Kevés vízzel vagy alaplével felöntjük, fedő alatt 35-40 percig főzzük puhára.","A burgonyát kockázzuk, bő olajban aranybarnára sütjük, tálaláskor sózzuk.","A ropogós krumplira halmozzuk a húsos raguját.","Petrezselyemmel szórjuk meg."],"u":"brassoi-apropecsenye"},"s19":{"t":40,"s":4,"st":["Olajon megpirítjuk a hagymát, fokhagymát, pirospaprikát, vízzel felengedjük.","Darált húst adunk hozzá, fehéredésig pirítjuk.","Vízzel elkevert paradicsompürét öntünk rá, sózzuk, borsozzuk, csilipaprikával ízesítjük.","Amikor a hús megpuhult, hozzákeverjük a lecsepegtetett babot és kukoricát.","5-10 percig együtt forraljuk, forrón tálaljuk."],"u":"chilis-bab"},"s22":{"t":75,"s":4,"st":["Olajon megdinszteljük a hagymát és fokhagymát, a darált húst kifehérítjük.","Sóval, borssal fűszerezzük, kevés vízzel megpároljuk, paradicsomszósszal és bazsalikommal összefőzzük.","Vajból és lisztből besamelt főzünk langyos tejjel.","Tepsiben rétegezzük: ragu, besamel, lasagne tészta; a tetejére ragu.","Reszelt sajttal megszórjuk, fóliával fedve 170 fokon 35-40 percig sütjük."],"u":"lasagne"},"s24":{"t":10,"s":1,"st":["Közepes lángon vajat és olajat habzásig hevítünk.","A tojásokat sóval röviden felverjük.","A habzó vajra öntjük, körkörösen kevergetve sütjük.","Ne süssük szárazra: három tojásnál 1-2 perc elég.","Pirospaprikával vagy sajttal szórjuk, pirítóssal tálaljuk."],"u":"rantotta"},"s25":{"t":40,"s":4,"st":["Megtisztítjuk és felaprítjuk a zöldségeket.","Olajon röviden megpirítjuk a hagymát.","Hozzáadjuk a többi zöldséget, 2 percig együtt pirítjuk.","1,5 liter vízzel felöntjük, leveskockával 15 percig főzzük puhára.","A levestésztát külön kifőzzük, a leves forró levesbe keverjük, tálaljuk."],"u":"zoldsegleves"},"r1":{"t":30,"s":4,"st":["Áztasd be a zsemlét vízbe, majd jól facsard ki.","Pirítsd meg olajon az apróra vágott hagymát, a fokhagymát préseld össze.","Keverd össze a húst, a zsemlét, a hagymát, a fokhagymát, a tojást és a fűszereket.","Nedves kézzel formálj gombócokat, és forgasd meg zsemlemorzsában.","Süsd ki nem túl forró olajban, oldalanként kb. 5 percig."],"u":"fasirt"},"r2":{"t":0,"s":0,"st":["A tejet langyosítsd, cukorral és élesztővel futtasd fel.","A főtt burgonyát pürésítsd, keverd a lisztbe az élesztővel és a tejjel, dagaszd tésztává.","Kelesztd háromszorosára, formálj kis cipókat, pihentesd 15 percig, húzd laposra.","Forró olajban süsd mindkét oldalát aranysárgára.","Tálald tejföllel, reszelt sajttal vagy fokhagymás öntettel."],"u":"langos"},"r3":{"t":55,"s":4,"st":["A rizst sós vízben megfőzzük, hagyjuk kihűlni.","A cukkinit karikázzuk, besózzuk, hagyjuk levet ereszteni.","A hagymát megdinszteljük, hozzáadjuk a darált húst, fehéredésig pirítjuk, fokhagymával, fűszerekkel és a rizzsel keverjük.","Tepsibe cukkinit, húsos-rizses keveréket és tejfölt rétegezünk, a tetejére tejfölt és sajtot szórunk.","180 fokon kb. 40 perc alatt aranybarnára sütjük."],"u":"rakott-cukkini"},"r4":{"t":30,"s":4,"st":["A burgonyát megtisztítjuk, lereszeljük, lecsepegtetjük.","Tojást és lisztet adunk hozzá, sózzuk, borsozzuk, elkeverjük.","Forró olajba kanalazzuk a masszát, és a kanál hátával lelapítjuk.","Mindkét oldalát kb. 5-5 percig aranybarnára sütjük, papírtörlőn leitatjuk.","Fokhagymával megkenve vagy tejföllel tálaljuk."],"u":"tocsni"},"r5":{"t":15,"s":4,"st":["Zsírt olvasztunk, lisztet keverünk bele, zsemleszínűre pirítjuk.","Zúzott fokhagymát, majd a kiolvasztott spenótot keverjük hozzá.","Alaplével és tejjel felöntjük, 10 percig forraljuk.","Sóval, cukorral, citromlével ízesítjük, feltéttel tálaljuk."],"u":"legfinomabb-spenotfozelek"},"r6":{"t":25,"s":4,"st":["Sós vízben al dente főzzük a spagettit, kb. 1 dl főzővizet félreteszünk.","A tojásokat felverjük a reszelt parmezánnal, sózzuk, borsozzuk.","A szalonnát száraz serpenyőben ropogósra sütjük.","A forró tésztát a szalonnához tesszük, levesszük a tűzről, és a tojásos keverékkel gyorsan összeforgatjuk.","Ha sűrű, főzővízzel lazítjuk; azonnal tálaljuk."],"u":"carbonara-spagetti"},"r7":{"t":50,"s":6,"st":["Zsíron dinszteljük a hagymát, hozzáadjuk a fokhagymát és a pirospaprikát.","Kockázott sertéshúst és kevés alaplevet adunk hozzá, puhára pároljuk.","A káposztát babérlevéllel, alaplével félig megfőzzük.","Hozzáadjuk a rizst, a húst, majd a karikázott kolbászt.","Tejfölt liszttel simára keverve a leveshez adjuk, pár percig forraljuk."],"u":"klasszikus-korhelyleves"},"r8":{"t":55,"s":4,"st":["Zsírban megpirítjuk a hagymát, hozzáadjuk a fokhagymát.","Hozzátesszük a répát, a gyökeret és a kockázott krumplit, fűszerpaprikával ízesítjük, felöntjük.","Sózzuk, borsozzuk, babérlevéllel puhára főzzük.","Félig puhán kolbászkarikákat adunk hozzá.","Tejfölt liszttel elkeverve visszaöntjük, még pár percig forraljuk."],"u":"krumplileves"},"r9":{"t":120,"s":4,"st":["Előző este beáztatjuk a babot és a csülköt, másnap leöblítjük.","A csülköt fedő alatt kb. 50 percig félpuhára főzzük, hozzáadjuk a babot és a babérlevelet.","Félpuhán bekerül a répa; a csipetkéhez lisztből, tojásból, sóból tésztát gyúrunk.","Lisztből és hagymából rántást készítünk, paprikával, hideg vízzel elkeverjük, a levesbe szűrjük, tejfölt keverünk bele.","A csipetkét 10-12 percig főzzük, a csülköt kicsontozva visszatesszük."],"u":"csulkos-bableves"},"r10":{"t":80,"s":5,"st":["Olajból és lisztből rántást készítünk, hideg vízzel felengedjük, paradicsompürével és fűszerekkel mártást főzünk.","A hagymát megdinszteljük, darált hússal, félig főtt rizzsel, tojással és fűszerekkel összekeverjük.","A kimagozott paprikákat megtöltjük, a maradék tölteléket gombócokká formáljuk.","Mindkettőt a mártásba tesszük, fedő alatt kb. 50 percig főzzük.","Főtt burgonyával tálaljuk."],"u":"toltott-paprika-paradicsommartasban"},"r11":{"t":75,"s":6,"st":["A káposztát puhára főzzük, leszűrjük. A rizst olajon pirítjuk, sós vízzel megpároljuk.","A szalonnát és a hagymát megpirítjuk, hozzáadjuk a darált húst, fűszerezzük, készre pároljuk.","Tepsibe rétegezzük: káposzta, rizs, hús, végül káposzta.","Tejföllel lekenjük, 160 fokon 35-40 percig sütjük."],"u":"klasszikus-rakott-kaposzta"},"r12":{"t":30,"s":4,"st":["Ecetes lé: víz, ecet, cukor, só, zúzott fokhagyma; a salátát beleáztatjuk 15 percre.","Nokedlitészta: lisztből, sóból, tojásból és vízből sűrű tésztát keverünk.","A nokedlit sós vízben szaggatjuk, 2-3 percig főzzük, leszűrjük.","A tojást felverjük, olajon lágyan megsütjük, és összeforgatjuk a nokedlivel.","Melegen, az ecetes salátával tálaljuk."],"u":"szaftos-tojasos-nokedli"},"r13":{"t":45,"s":4,"st":["A hagymát zsíron megdinszteljük, lisztet szórunk rá.","Tejfölt, gyalult tököt, kaprot adunk hozzá, kevés vízzel puhára főzzük.","A pörkölthöz hagymát pirítunk, paprikát és paradicsomot párolunk.","A kockázott csirkemellet fehéredésig sütjük, pirospaprikával ízesítjük, kevés vízzel puhára pároljuk.","A pörköltet a főzelékkel együtt tálaljuk."],"u":"tokfozelek-csirkemell-porkolttel"},"r14":{"t":35,"s":4,"st":["A gombát megtisztítjuk, felszeleteljük, a hagymát apróra vágjuk.","Olajon üvegesre pároljuk a hagymát, hozzáadjuk a gombát, sózzuk, borsozzuk, 5-6 percig pároljuk.","Levesszük a tűzről, pirospaprikát szórunk rá, felöntjük kb. 1,2 liter vízzel.","Felforraljuk, közepes lángon 20-25 percig főzzük.","A tejfölt liszttel simára keverjük, forró levessel elegyítjük, visszaöntjük és sűrítjük."],"u":"gombaleves"},"r15":{"t":80,"s":4,"st":["A csirkecombokat sózzuk, borsozzuk, olajon bőrös oldalukkal aranybarnára pirítjuk.","A hagymát, fokhagymát, paprikát, paradicsomot megpároljuk, pirospaprikával ízesítjük, gombával pirítjuk.","A combokat visszatesszük, alaplével felöntjük, lefedve 35-45 percig puhára pároljuk.","A tejfölt liszttel simára keverjük, a szaftból merünk hozzá, besűrítjük.","Galuskával, nokedlivel vagy rizzsel tálaljuk."],"u":"bakonyi-csirkecomb"},"r16":{"t":60,"s":4,"st":["A hagymát apróra vágjuk, a csirkemellet 2 cm-es kockákra daraboljuk, a zöldségeket felaprítjuk.","Zsíron üvegesre pirítjuk a hagymát, hozzáadjuk a húst, átpirítjuk.","Fokhagymát, paprikát, pirospaprikát, paradicsomot adunk hozzá, vízzel felöntve fedő alatt pároljuk.","Ha a hús megpuhult, tejszínt öntünk rá, tejfölt keverünk bele, újra felforraljuk.","Nokedlivel, savanyúsággal tálaljuk."],"u":"csirkemellpaprikas"},"r17":{"t":150,"s":4,"st":["Az oldalast feldaraboljuk, tepsibe tesszük, sózzuk, borsozzuk, köménnyel, majoránnával fűszerezzük.","Rárakjuk a paprikát, hagymát, babérlevelet, fokhagymát, paradicsomot.","130 fokon, fóliával fedve, kevés vízzel 1,5 órát sütjük.","Fólia nélkül 160 fokon még 20-25 percig sütjük, félidőben megfordítjuk.","A sült zöldségekkel tálaljuk."],"u":"magyaros-sult-oldalas"},"r18":{"t":45,"s":4,"st":["Megmossuk és felszeleteljük a gombát, a hagymát felkockázzuk.","Zsíron üvegesre pirítjuk a hagymát, hozzáadjuk a gombát, tovább pirítjuk.","Ha a gomba leadta a levét, köménnyel, paprikával, sóval, borssal ízesítjük.","Fokhagymával és lisztes tejföllel behabarjuk.","Tojásból, lisztből, sóból galuskát szaggatunk sós vízbe, leszűrjük."],"u":"gombapaprikas-galuskaval"},"r19":{"t":60,"s":4,"st":["A gombát szárazon megpirítjuk, félretesszük, majd a csirkecsíkokat is megsütjük.","A hagymát megpároljuk, fokhagymát adunk hozzá, borral felöntjük.","Paradicsompürét, mustárt keverünk az alapba, visszatesszük a húst és a gombát.","Tejszínnel és tejföllel felöntjük, a csíkokra vágott uborkát pár percig főzzük.","Rizzsel vagy burgonyával tálaljuk."],"u":"sztroganov-csirkemell"},"r20":{"t":250,"s":4,"st":["Fűszerekből, mustárból, olajból pácot keverünk, a karajba zsebeket vágunk.","A húst bekenjük, legalább 2 órára hűtőbe tesszük.","A sajtot sonkába csomagoljuk, a zsebekbe töltjük, a sütőt 180 fokra melegítjük.","Póréhagymával, paprikával körbevéve, lefedve 90 percig sütjük.","A fóliát levesszük, 200 fokon 5-10 percig pirítjuk, 20 percet pihentetve szeleteljük."],"u":"szaftos-zsebes-karaj"},"r21":{"t":45,"s":4,"st":["A bordákat sózzuk, borsozzuk, kiklopfoljuk, olívaolajjal megkenjük.","Lisztekbe, tojásba, tökmagos morzsába forgatjuk, forró zsírban kisütjük.","A hagymát üvegesre pároljuk, karikázott újburgonyát adunk hozzá.","Sóval, borssal ízesítjük, fedő alatt puhára pároljuk, petrezselyemmel szórjuk.","A rántott hússal együtt tálaljuk."],"u":"rantott-hus-meg-finomabban"},"r22":{"t":30,"s":2,"st":["A sajtot falatokra vágjuk, kétszer panírozzuk (liszt, tojás, liszt, tojás, morzsa).","A rizst olajon átpirítjuk, kétszeres vízzel felöntjük, sózzuk, fedő alatt főzzük.","Ha a rizs felszívta a vizet, levesszük a tűzről, 6-8 percig pihentetjük.","A sajtot olajon aranybarnára sütjük.","Rizzsel, ketchuppal vagy majonézzel tálaljuk."],"u":"rantott-sajt-parolt-rizzsel"},"r23":{"t":105,"s":2,"st":["Mindkét oldalán besózzuk a hússzeleteket, hűtőben pihentetjük legalább 1 órát.","A hagymakarikákat keményítővel átforgatjuk, olajban ropogósra sütjük.","Magas lángon kérgezzük a húst, vajjal, fokhagymával, rozmaringgal locsolgatjuk.","5 percig pihentetjük, borból és mustárból mártást készítünk, redukáljuk.","Vajjal simítjuk a mártást, a hússal és a ropogós hagymával tálaljuk."],"u":"hagymas-marha-rostelyos-recept"},"r24":{"t":70,"s":4,"st":["A szalonnát zsírján pirítjuk, hozzáadjuk az apróra vágott hagymát.","Fokhagymát, paprikát dinsztelünk, pirospaprikával ízesítjük, sózzuk, borsozzuk.","Paradicsomot, kevés vizet, babérlevelet, zellert, vajbabot teszünk bele.","Vízzel éppen ellepjük, fedő nélkül kb. 30 percig főzzük.","Tejföllel és friss kenyérrel tálaljuk."],"u":"zoldbabporkolt-egyszeruen"},"r25":{"t":30,"s":4,"st":["A karikázott kolbászt olajon zsírjára pirítjuk, félretesszük.","A hagymát babérlevéllel dinszteljük, paradicsompürét keverünk hozzá.","Fokhagymát, pirospaprikát, majorannát pirítunk az alapon.","Lecsepegtetett babot adunk hozzá, vízzel ellepjük, felforraljuk.","Tejfölös-lisztes habarással sűrítjük, pirított kolbásszal tálaljuk."],"u":"villamgyors-babfozelek-piritott-kolbasszal"},"r26":{"t":30,"s":4,"st":["Előző este beáztatjuk a lencsét.","Felaprítjuk a zöldségeket, a szalonnát és a kolbászt.","Zsíron karamellizáljuk a cukrot, pirítjuk benne a szalonnát, kolbászt, zöldségeket, mustárt.","Hozzáadjuk a lencsét, vízzel vagy húslevessel felöntjük, fűszerezzük.","Lisztes tejfölös habarással sűrítjük, kiforraljuk."],"u":"lencsefozelek-20-perc-alatt"},"r27":{"t":60,"s":4,"st":["A káposztát csíkokra szeljük, a hagymát olajon megdinszteljük, hozzáadjuk a káposztát.","Paradicsomlével és vízzel felöntjük, sóval, borssal, cukorral ízesítjük, fedő alatt fél órát főzzük.","Olajból és lisztből rántást készítünk, a főzőlével elkeverjük.","A rántást a főzelékhez keverjük, jól összeforraljuk.","Fasírttal vagy pörkölttel tálaljuk."],"u":"hagyomanyos-paradicsomos-kaposzta"},"r28":{"t":45,"s":4,"st":["A borsót kb. 2 órát áztatjuk, babérlevéllel puhára főzzük.","Olajon megdinszteljük a hagymát és fokhagymát, fűszerezzük.","Lisztet szórunk rá, illatosra pirítjuk, vízzel felengedjük.","A rántást keverés mellett a forró borsóhoz adjuk, összeforraljuk.","Sóval, borssal ízesítjük, melegen tálaljuk."],"u":"a-legfinomabb-sargaborso-fozelek"},"r29":{"t":90,"s":4,"st":["A hagymát a darált hússal, rizzsel, tojással összegyúrjuk, sózzuk, borsozzuk.","Két liter vízben feloldjuk a leveskockát, paradicsompürét keverünk hozzá, felforraljuk.","A masszából almányi gombócokat formázunk, fedő alatt kb. 1 órán át főzzük.","Olajból és lisztből rántást készítünk, a főzőlével felengedjük, cukorral, sóval ízesítjük.","A gombócokat visszatesszük, főtt krumplival tálaljuk."],"u":"paradicsomos-husgomboc"},"r30":{"t":30,"s":4,"st":["Zsíron dinszteljük a hagymát és a paprikát, fűszerezve, paradicsommal, vízzel puhára főzzük.","A hártyátlan szűzszeleteket nagy lángon gyorsan megpirítjuk, sózzuk, borsozzuk.","A serpenyő pörzsanyagát vízzel felkaparjuk, a paprikás alaphoz öntjük.","Tejszínnel, tejföllel, vajjal botmixerrel simára turmixoljuk, visszatesszük a tűzre.","A húst a mártásban átmelegítjük, nokedlivel tálaljuk."],"u":"paprikas-sertesszuz"},"r31":{"t":80,"s":4,"st":["Sózzuk, borsozzuk a combokat, bőrös felükkel lefelé aranybarnára pirítjuk.","A répát és a karikázott póréhagymát kb. 5 percig pirítjuk.","Zöldségágyra rendezzük a combokat, kakukkfűvel, petrezselyemmel szórjuk, 3 dl forró vízzel felöntjük.","Lefedve 160 fokon 30 percig, majd fólia nélkül 20 percig sütjük.","A párolólevet besűrítjük tejszínnel és mustárral, a combokra öntjük."],"u":"tepsis-csirkecombok"},"r32":{"t":60,"s":4,"st":["Kizsírozott tepsiben a burgonyagerezdeket és a hagymát sóval, borssal, olajjal fűszerezzük.","200 fokon 15-20 percig sütjük, átforgatjuk.","Ráhelyezzük a karikázott kolbászt, a lila hagymát és a beirdalt szalonnát.","Még 10-15 percig sütjük, amíg minden ropogós.","Petrezselyemmel megszórva melegen tálaljuk."],"u":"parasztos-tepsis-krumpli"},"r33":{"t":30,"s":2,"st":["A cukkinit meghámozzuk, nagy lyukú reszelőn lereszeljük, vízzel ellepjük.","Hozzáadjuk az apróra vágott kaprot, sózzuk, puhára főzzük.","A tejszínt simára keverjük a liszttel és kevés cukkinilével.","A forró főzelékhez öntjük, összeforraljuk, 10 percig pihentetjük.","Fasírttal tálaljuk."],"u":"kapros-cukkinifozelek"},"r34":{"t":120,"s":8,"st":["Zsíron üvegesre pirítjuk a hagymát, paprikát, fokhagymát adunk hozzá, átpirítjuk.","Vízzel felöntjük, sózzuk, borsozzuk, köménnyel ízesítjük, a puhuló húshoz zöldséget adunk.","10 perc után a burgonyát is beletesszük, további 10 percig főzzük.","Tojásból, lisztből, sóból csipetkét gyúrunk, lisztes kézzel csipegetjük.","A csipetkét belefőzzük, friss kenyérrel tálaljuk."],"u":"alfoldi-gulyasleves"},"r35":{"t":90,"s":8,"st":["A húst kockázzuk, a hagymát, fokhagymát apróra vágjuk, a zöldségeket felkockázzuk.","Olajon hagymát üvegesítünk, húst pirítunk, pirospaprikával, köménnyel, babérral fűszerezzük.","Kb. 1,5 liter vízzel felöntjük, félpuhára főzzük, hozzáadjuk a burgonyát, zöldbabot, répát.","A tejfölt liszttel simára keverjük, behabarjuk a levest, 5 percig forraljuk.","Petrezselyemmel szórva, friss kenyérrel tálaljuk."],"u":"palocleves"},"r36":{"t":60,"s":4,"st":["Olajon megpirítjuk a felaprított zöldségeket, hozzáadjuk a gombát és a csirkemellcsíkokat.","Kurkumát szórunk rá, 1,5 liter forró vízzel felöntjük, sózzuk, kis lángon főzzük.","Hozzáadjuk a krumplit, zöldborsót, paradicsomot, lestyánt, tovább főzzük.","Tojásból, lisztből, darából galuskát készítünk, tárkonnyal ízesítve szaggatjuk a levesbe.","Joghurtot lisztel csomómentesen elkeverünk, forró levessel hígítva behabarjuk a levest."],"u":"csirkeraguleves"},"r37":{"t":55,"s":6,"st":["Olajon megpirítjuk a hagymát, borsóval sózva picit megpároljuk.","Paprikával megszórjuk, vízzel felöntjük, hozzáadjuk a répát, petrezselymet, karalábét.","5 percig főzzük, aztán a kockázott burgonyát tesszük bele, még 10 percig főzzük.","Lisztből, tojásból, sóból, vízből lágy nokedlitésztát gyúrunk.","A forró levesbe szaggatjuk a galuskát, 1-2 percig főzzük, melegen tálaljuk."],"u":"borsoleves-galuskaval"},"r38":{"t":45,"s":4,"st":["A brokkolit rózsákra bontjuk, a burgonyát kockázzuk, a hagymát, fokhagymát apróra vágjuk.","Vajban megfonnyasztjuk a hagymát, fokhagymát, a burgonyát is pirítjuk, erőlevessel felöntjük.","Brokkolit adunk hozzá, fedő alatt 15 percig főzzük, pár rózsát díszítésnek félreteszünk.","Botmixerrel krémesre turmixoljuk, keményítős tejszínnel besűrítjük, sózzuk, borsozzuk.","A félretett rózsákkal és pirított mandulával tálaljuk."],"u":"brokkolikremleves"},"r39":{"t":40,"s":2,"st":["Sós, forró vízben kifőzzük a penne tésztát.","Az apróra vágott fokhagymát olajon pirítjuk, hozzáadjuk a paradicsomot és a bort, összeforraljuk.","Sózzuk, borsozzuk, csilivel, oregánóval, barnacukorral ízesítjük, kb. 15 percig főzzük.","Friss bazsalikomot keverünk a szószba, hozzáadjuk a megfőtt tésztát.","Forrón, reszelt parmezánnal tálaljuk."],"u":"penne-all-arrabbiata-alaprecept"},"r40":{"t":60,"s":4,"st":["A makarónit kifőzzük, lecsepegtetjük.","Olajon megpirítjuk a kockázott kolbászt, puhára pároljuk a hagymát és fokhagymát.","Megpirítjuk a gombát, hozzáadjuk a sonkát és a kolbászos keveréket, paradicsomszósszal felöntjük.","A tésztát összekeverjük a szósszal és a sajt felével, hőálló tálba öntjük.","A maradék sajttal megszórjuk, 200 fokon ropogósra sütjük."],"u":"milanoi-makaroni"},"r41":{"t":45,"s":4,"st":["A tojásfehérjét sóval habbá verjük, a sárgáját cukorral kihabosítjuk.","Az áttört túróhoz keverjük a sárgás masszát, zsírt, búzadarát, óvatosan a fehérjehabot.","Gombócokat formázunk, 20 percig pihentetjük.","Olajon kevergetve aranybarnára pirítjuk a zsemlemorzsát.","Gyöngyöző vízben főzzük a gombócokat, felúszás után még 2-3 percig, majd a morzsában forgatjuk."],"u":"a-legfinomabb-turogomboc"},"r42":{"t":40,"s":4,"st":["Összekeverjük a lisztet, sütőport, tojást és vaníliás cukrot.","Tejjel, margarinnal, cukorral palacsintatészta sűrűségűre keverjük.","A csomómentes tésztát fél órát pihentetjük a hűtőben.","A felmelegített gofrisütőt kikenjük, tésztát töltünk bele, aranybarnára sütjük.","Lekvárral, nutellával, porcukorral tálaljuk."],"u":"a-legfinomabb-gofri"},"r43":{"t":30,"s":4,"st":["Megtisztítjuk, megmossuk a spenótot, a vastag ereket eltávolítjuk.","Sós vízben 3-4 percig főzzük, leöblítjük, botmixerrel pépesítjük.","A tejet felforraljuk, margarinon világosra pirítjuk a lisztet és a fokhagymát.","Hideg tejjel hígítjuk, forró tejjel apránként besűrítjük.","Belekeverjük a spenótpürét, összeforraljuk, főtt tojással tálaljuk."],"u":"spenotfozelek"}}; // receptek: mindmegette.hu (t=perc, s=adag, st=lépések, u=oldal)

const mealBg=(m,big)=>{const u=mealImg(m);return u?`background:linear-gradient(180deg,rgba(0,0,0,${big?".0":".05"}) ${big?"35%":"0"},rgba(0,0,0,${big?".72":".45"})),url(${JSON.stringify(u)}) center/cover`:`background:${grad(m)}`};
const mealTile=m=>h("div",{class:"tile",style:mealBg(m)+";color:#fff"},mealImg(m)?null:m.emoji);
const afterPaint=f=>requestAnimationFrame(()=>requestAnimationFrame(f));
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dayLabel=ds=>{const d=parseD(ds);return DAYS[(d.getDay()+6)%7]+", "+MS[d.getMonth()]+" "+d.getDate()+"."};

function h(tag,props,...kids){

function buildPrompt(){

  const known=[...new Set(inv().map(i=>i.name))].slice(0,80).join(", ");
  return `Ez egy magyarországi vásárlási blokk fotója. A bolt bármelyik lehet, és minden bolt másként nyomtat, ezért ne boltra jellemző mintát feltételezz, hanem a blokk szerkezetét olvasd le. A kiolvasott adatokat a "rogzit" eszközzel add vissza.
Módszer:
1. Nézd meg a szerkezetet: hol áll a terméknév; a "2 db * 619 Ft" jellegű mennyiség-egységár sor a név előtt vagy után áll-e; melyik oszlop a sorösszeg (általában a jobb szél). Ezt a blokk egészén következetesen alkalmazd. A fotó lehet ferde, görbült, árnyékos: az érték vizuálisan egy sorral följebb vagy lejjebb látszhat a névhez képest, ilyenkor a sorrend dönt (az n-edik név az n-edik értékhez tartozik).
2. A "valueColumn" mezőbe először írd ki a sorösszeg-oszlop összes számát fentről lefelé (az ÖSSZESEN/végösszeg nélkül; két egymás utáni azonos szám két külön tétel, egyiket se hagyd ki, és az utolsó sort se; az ezreseket szóköz választhatja el: "1 238" = 1238; a negatív kedvezmény is külön szám).
3. Az "items" tömb elemei ezekhez igazodjanak sorrendben: egy elem = egy sorösszeg. A mennyiség-sor nem külön tétel, a hozzá tartozó érték a hozzá tartozó terméké. A "lineTotal" a tétel sorösszege forintban, a "quantity" a darabszám (tizedes is lehet, kg-nál).

const RSCHEMA={type:"object",properties:{valueColumn:{type:"array",items:{type:"number"}},store:{type:"string"},purchasedAt:{type:"string"},totalAmount:{type:"number"},items:{type:"array",items:{type:"object",properties:{raw:{type:"string"},name:{type:"string"},guess:{type:"boolean"},quantity:{type:"number"},lineTotal:{type:"number"},category:{type:"string"}},required:["name","quantity","lineTotal","category"]}}},required:["items"]};

function parseReceipt(j){

  if(typeof d==="string"){try{d=JSON.parse(d)}catch(e){throw new Error("A válasz hibás formátumú. Próbáld újra.")}}

    if(vc.length===d.items.length&&Math.abs(vc.reduce((a,b)=>a+b,0)-Number(d.totalAmount))<=1)d.items.forEach((it,i)=>{it.lineTotal=vc[i]})}
  return{receiptTotal:Number(d.totalAmount)||0,store:String(d.store||""),dateFound:/^\d{4}-\d{2}-\d{2}$/.test(d.purchasedAt),date:/^\d{4}-\d{2}-\d{2}$/.test(d.purchasedAt)?d.purchasedAt:fmt(new Date()),

const recDiff=r=>r.receiptTotal>0?Math.abs(Math.round(r.items.reduce((a,i)=>a+i.quantity*i.unitPrice,0)-r.receiptTotal)):0;

async function scanReceipt(b64,model){
  const msgs=[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:buildPrompt()}]}];
  let best=null,mdl=model||cfg.model||"claude-haiku-5-5";
  for(let round=0;round<4;round++){
    const j=await apiCall(msgs,mdl);
    let r;try{r=parseReceipt(j)}catch(e){if(best)break;throw e}
    const diff=recDiff(r);
    if(!best||diff<best.diff)best={r,diff};
    if(diff<=1||!r.receiptTotal)break;
    const tu=(j.content||[]).find(c=>c.type==="tool_use");if(!tu)break;
    const sum=Math.round(r.items.reduce((a,i)=>a+i.quantity*i.unitPrice,0));
    const rows=r.items.map((i,n)=>`${n+1}. ${i.raw||i.name} | ${i.quantity} × ${i.unitPrice} = ${Math.round(i.quantity*i.unitPrice)}`).join("\n");
    msgs.push({role:"assistant",content:j.content},{role:"user",content:[{type:"tool_result",tool_use_id:tu.id,is_error:true,content:`Hibás: a tételek összege ${sum} Ft, a blokk végösszege ${r.receiptTotal} Ft (eltérés ${sum-r.receiptTotal} Ft). Az eddigi tételek:\n${rows}\nNézd meg újra a fotót sorról sorra. Gyakori okok: kihagyott vagy kétszer felvett tétel, elcsúszott név–érték párosítás, rosszul olvasott szám, mennyiség-sor külön tételként, kedvezmény vagy betétdíj figyelmen kívül hagyva. Hívd meg újra a "rogzit" eszközt a javított, teljes listával.`}]});
  }
  return best.r;
}

const arr=x=>Array.isArray(x)?x:Object.values(x||{});
function logU(u,type,data){u["log/"+uid()]={t:Date.now(),type,by:me||"",...data};return u}
function trimLog(u){const ks=Object.entries(T.log||{}).sort((a,b)=>(a[1].t||0)-(b[1].t||0));if(ks.length>300)ks.slice(0,100).forEach(([k])=>{u["log/"+k]=null});return u}

function logSummary(){
  const L=Object.values(T.log||{}).sort((a,b)=>(a.t||0)-(b.t||0)),by=t=>L.filter(e=>e.type===t);
  const cnt=(list)=>{const m={};list.forEach(n=>{const k=String(n).trim();if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const sug=[];
  const eg=cnt(by("egyeb").flatMap(e=>arr(e.names)));
  if(eg.length>=3)sug.push(`Sok tétel került az "egyéb" kategóriába (${eg.reduce((s,e)=>s+e[1],0)} db). Új kategória(k) kellhetnek. Leggyakoribbak: ${eg.slice(0,10).map(e=>e[0]+(e[1]>1?" ×"+e[1]:"")).join(", ")}.`);
  const mm=by("total_mismatch");
  if(mm.length)sug.push(`${mm.length} blokknál nem egyezett a tételek összege a végösszeggel (bolt: ${[...new Set(mm.map(e=>e.store||"?"))].join(", ")}). A blokkolvasó promptot finomítani kell. Példák: ${mm.slice(-3).map(e=>`végösszeg ${e.receipt}, tételek ${e.sum}`).join("; ")}.`);
  const se=by("scan_error");
  if(se.length)sug.push(`${se.length} olvasási hiba: ${[...new Set(se.map(e=>e.msg))].slice(0,3).join(" | ")}`);
  const nf=[];by("name_fix").forEach(e=>arr(e.pairs).forEach(p=>nf.push(arr(p).join(" → "))));
  if(nf.length)sug.push(`Kézzel javított terméknevek (${nf.length}): ${cnt(nf).slice(0,10).map(e=>e[0]).join("; ")}.`);
  const np=cnt(by("no_photo").flatMap(e=>arr(e.names)));
  if(np.length)sug.push(`Ételek fotó nélkül (${np.length}): ${np.slice(0,12).map(e=>e[0]).join(", ")}.`);
  const notes=by("note").map(e=>`${PROFILES[e.by]?PROFILES[e.by].name:"?"}: ${e.text}`);
  if(notes.length)sug.push("Saját jegyzetek:\n"+notes.map(n=>"  - "+n).join("\n"));
  const text=`# Háztartás app – fejlesztési napló (${fmt(new Date())})\n\n`+(sug.length?sug.map(x=>"- "+x).join("\n"):"(nincs még javaslat)")+`\n\nEsemény összesen: ${L.length}`;
  return{sug,text,count:L.length};
}

        h("button",{class:"btn ghost",onclick:()=>{const a=h("a",{href:URL.createObjectURL(new Blob([JSON.stringify(T,null,2)],{type:"application/json"})),download:"haztartas-"+fmt(new Date())+".json"});a.click()}},"📤 Export"),
        h("button",{class:"btn ghost",onclick:()=>imp.click()},"📥 Import")),imp,
      h("button",{class:"btn danger block",onclick:()=>{close();me=null;LSset("hh.me",null);animNext=true;setTimeout(render,340)}},"Profilváltás"));
  });
}

/* ---------- ételfotók: saját fotó vagy beillesztett kép-URL ---------- */
function resizeImg(file,max=520){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.78))};
    img.onerror=()=>rej(new Error("A kép nem olvasható."));img.src=url;
  });
}
function openRecipe(m){
  const r=RINFO[m.id],bigimg=mealImg(m);
  sheet((b,close)=>{
    b.append(h("div",{class:"tile",style:"width:100%;height:190px;border-radius:18px;margin-bottom:12px;color:#fff;font-size:64px;"+mealBg(m,true)},bigimg?null:m.emoji),
      h("h2",{class:"t wrap"},m.name));
    if(r){const meta=[r.t?"⏱ "+r.t+" perc":"",r.s?"🍽 "+r.s+" adag":""].filter(Boolean).join("  ·  ");if(meta)b.append(h("p",{class:"mu sm",style:"margin:-8px 0 12px"},meta))}
    b.append(h("h2",{style:"font-size:15px;margin:6px 0"},"Hozzávalók"),h("div",{class:"chips",style:"margin-bottom:12px"},m.ingredients.map(i=>h("span",{class:"chip"},i))));
    if(r&&r.st&&r.st.length){b.append(h("h2",{style:"font-size:15px;margin:6px 0"},"Elkészítés"),
      h("ol",{style:"margin:0 0 12px;padding-left:20px;line-height:1.5"},r.st.map(x=>h("li",{style:"margin-bottom:6px"},x))));
      if(r.u)b.append(h("p",{class:"mu sm"},"Forrás: ",h("a",{href:"https://www.mindmegette.hu/recept/"+r.u,target:"_blank",rel:"noopener",style:"color:var(--a2)"},"mindmegette.hu"),". Rövidített leírás, az eredeti oldalon a pontos mennyiségekkel."))}
    else b.append(h("p",{class:"mu sm"},"Ehhez az ételhez nincs mentett recept."));
    b.append(h("button",{class:"btn ghost block",style:"margin-top:10px",onclick:()=>{close();setTimeout(()=>openMealPhoto(m),360)}},"📷 Fotó módosítása"));
  });
}
function openMealPhoto(m,after){
  sheet((b,close)=>{
    const prev=h("div",{class:"tile",style:"width:100%;height:170px;border-radius:18px;margin-bottom:12px;color:#fff;font-size:56px;"+mealBg(m,true)},mealImg(m)?null:m.emoji);
    const err=h("div",{class:"err"}),file=h("input",{type:"file",accept:"image/*",style:"display:none"});
    const url=h("input",{placeholder:"Kép webcíme (https://…)",type:"url",inputmode:"url"});
    const save=v=>{multi({["img/"+m.id]:v});close();toast(v?"Fotó mentve":"Fotó törölve","📷");if(after)after()};
    file.addEventListener("change",async()=>{const f=file.files[0];if(!f)return;try{save(await resizeImg(f))}catch(e){err.textContent=e.message}});
    b.append(h("h2",{class:"t wrap"},"Fotó: "+m.name),prev,
      h("button",{class:"btn block",onclick:()=>file.click()},"📷 Fotó készítése / kiválasztása"),file,
      h("a",{class:"btn ghost block",style:"margin-top:8px;text-decoration:none;text-align:center",target:"_blank",rel:"noopener",
        href:"https://www.mindmegette.hu/kereses/?q="+encodeURIComponent(m.name)},"🔎 Keresés a mindmegette.hu-n"),
      h("p",{class:"mu sm",style:"margin:10px 0 6px"},"Keress rá, nyomj hosszan a képre → „Kép címének másolása”, és illeszd be ide:"),
      h("div",{class:"pair"},url,h("button",{class:"btn s",style:"flex:0 0 auto",onclick:()=>{const v=url.value.trim();if(!/^https:\/\//.test(v)){err.textContent="https:// címet adj meg.";return}save(v)}},"Mentés")),err,
      mealImg(m)?h("button",{class:"btn danger block",style:"margin-top:8px",onclick:()=>save("")},"Fotó törlése"):null);
  });
}
